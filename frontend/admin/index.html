<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="login-screen" class="centered" hidden>
    <h1>Admin Login</h1>
    <button id="login-button">Login with Google</button>
  </div>

  <div id="dashboard" hidden>
    <header>
      <h1>Basketball Website Admin</h1>
      <button id="logout-button">Log out</button>
    </header>

    <nav class="tabs">
      <button data-tab="content-blocks" class="active">Content Blocks</button>
      <button data-tab="news">News</button>
      <button data-tab="rosters">Rosters</button>
      <button data-tab="schedule">Schedule</button>
      <button data-tab="coaches">Coaches</button>
      <button data-tab="contacts">Contacts</button>
    </nav>

    <main id="section-container"></main>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
  <script>
    if (isLoggedIn()) {
      document.getElementById("dashboard").hidden = false;
      initDashboard();
    } else {
      document.getElementById("login-screen").hidden = false;
      document.getElementById("login-button").addEventListener("click", startLogin);
    }

    document.getElementById("logout-button").addEventListener("click", logout);
  </script>
</body>
</html>
