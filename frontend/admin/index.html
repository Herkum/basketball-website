<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="login-screen" class="centered" hidden>
    <h1>Admin Login</h1>
    <button class="btn btn-primary" id="login-button">Login with Google</button>
  </div>

  <div id="dashboard" hidden>
    <header class="ad-header">
      <div class="ad-header-inner">
        <div class="ad-brand">
          <span class="ad-brand-name">Newbury Park Basketball</span>
          <span class="ad-brand-tag">Site Admin</span>
        </div>
        <button class="btn btn-ghost" id="logout-button" type="button">Log out</button>
      </div>
    </header>

    <nav class="ad-nav">
      <div class="ad-nav-inner" id="ad-nav-groups"></div>
    </nav>

    <main id="section-container"></main>
  </div>

  <div id="ad-overlay-root"></div>

  <script src="config.js"></script>
  <script src="../shared.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
  <script>
    if (isLoggedIn()) {
      document.getElementById("dashboard").hidden = false;
      scheduleSessionTimeout();
      initDashboard();
    } else {
      document.getElementById("login-screen").hidden = false;
      document.getElementById("login-button").addEventListener("click", startLogin);
    }

    document.getElementById("logout-button").addEventListener("click", logout);
  </script>
</body>
</html>
